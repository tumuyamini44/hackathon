const schemeNames = {

    skill: "PMKVY",
    housing: "PM Awas Yojana",
    women: "PM Ujjwala Yojana",
    crop: "PM Fasal Bima Yojana",
    solar: "PM Surya Ghar"
};

function changeGuideLanguage(language) {
    const t = guideTranslations[language] || guideTranslations.English;

    document.querySelector(".hero h1").textContent = t.title;
    document.querySelector(".hero p").textContent = t.subtitle;
    document.querySelector(".container h2").textContent = t.select;
    document.querySelector("header a").textContent = t.home;
    document.querySelector("button").textContent = t.button;
    document.querySelector("footer").textContent = t.footer;

    const schemeSelect = document.getElementById("scheme");
    schemeSelect.options[0].textContent = t.choose;

    const values = ["education", "farmer", "health", "skill", "housing", "women", "crop", "solar"];

    values.forEach((value, index) => {
        schemeSelect.querySelector(`option[value="${value}"]`).textContent =
            t.schemes[index];
    });

    document.getElementById("languageSelector").value = language;
    localStorage.setItem("selectedLanguage", language);

    // Refresh an already displayed guide in the selected language
    if (schemeSelect.value) {
        showGuide();
    }
}

        <h3>${t.documents}</h3>

            ${data.documents.map(doc => `<li>${doc}</li>`).join("")}

document.addEventListener("DOMContentLoaded", function() {
